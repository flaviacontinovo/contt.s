<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Site da Flavia</title>
<meta name="description" content="Página oficial da Flavia. Site em construção — em breve mais informações.">

<meta property="og:type" content="website">
<meta property="og:title" content="Site da Flavia">
<meta property="og:description" content="Página oficial da Flavia. Site em construção — em breve mais informações.">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f5d50'/><text x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='600' fill='%23fff' text-anchor='middle'>F</text></svg>">

<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --text: #1c1c1a;
    --muted: #5d5c57;
    --accent: #2f5d50;
    --border: #e2e0da;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161815;
      --surface: #1e211d;
      --text: #ecece6;
      --muted: #a3a49c;
      --accent: #7fbfa8;
      --border: #2e322c;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
  }

  main {
    width: 100%;
    max-width: 34rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2.5rem 2rem;
    text-align: center;
  }

  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  p {
    margin: 0 auto;
    max-width: 28rem;
    color: var(--muted);
  }

  .badge {
    display: inline-block;
    margin-bottom: 1.5rem;
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    background: var(--accent);
    color: var(--bg);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  @media (max-width: 30rem) {
    main { padding: 2rem 1.25rem; }
  }
</style>
</head>
<body>
<main>
  <p class="badge">Em construção</p>
  <h1>Site da Flavia</h1>
  <p>Estamos preparando esta página. Em breve você encontrará aqui todas as informações.</p>
</main>
</body>
</html>
